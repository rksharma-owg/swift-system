name: Contribution preflight
permissions:
  contents: read
jobs:
  tests:
    name: Test
    uses: rksharma-owg/swift-system/.github/workflows/fork-package.yml@main
    with:
      swift_flags: -Xbuild-tools-swiftc -DSYSTEM_CI
      enable_linux_checks: true
      linux_os_versions: '["noble", "jammy", "focal"]'
      linux_exclude_swift_versions: "[\n  {\"swift_version\": \"5.9\"},\n  {\"swift_version\": \"5.10\"},\n  {\"swift_version\"\
        : \"6.0\"},\n  {\"os_version\": \"focal\", \"swift_version\": \"nightly-6.2\"},\n  {\"os_version\": \"focal\", \"\
        swift_version\": \"6.2\"},\n  {\"os_version\": \"focal\", \"swift_version\": \"nightly-6.3\"},\n  {\"os_version\"\
        : \"focal\", \"swift_version\": \"6.3\"},\n  {\"os_version\": \"focal\", \"swift_version\": \"nightly-6.4.x\"},\n\
        \  {\"os_version\": \"focal\", \"swift_version\": \"6.4.x\"},\n  {\"os_version\": \"focal\", \"swift_version\": \"\
        nightly-main\"},\n]\n"
      enable_macos_checks: true
      macos_exclude_xcode_versions: '[]'
      enable_windows_checks: true
      windows_exclude_swift_versions: "[\n  {\"swift_version\": \"5.9\"},\n  {\"swift_version\": \"5.10\"},\n  {\"swift_version\"\
        : \"6.0\"},\n]\n"
      enable_linux_static_sdk_build: true
      linux_static_sdk_exclude_swift_versions: "[\n  {\"os_version\": \"focal\", \"swift_version\": \"nightly-6.2\"},\n  {\"\
        os_version\": \"focal\", \"swift_version\": \"6.2\"},\n  {\"os_version\": \"focal\", \"swift_version\": \"nightly-6.3\"\
        },\n  {\"os_version\": \"focal\", \"swift_version\": \"6.3\"},\n  {\"os_version\": \"focal\", \"swift_version\": \"\
        nightly-6.4.x\"},\n  {\"os_version\": \"focal\", \"swift_version\": \"6.4.x\"},\n  {\"os_version\": \"focal\", \"\
        swift_version\": \"nightly-main\"},\n]\n"
      enable_wasm_sdk_build: true
      wasm_exclude_swift_versions: "[\n  {\"os_version\": \"focal\", \"swift_version\": \"nightly-6.2\"},\n  {\"os_version\"\
        : \"focal\", \"swift_version\": \"6.2\"},\n  {\"os_version\": \"focal\", \"swift_version\": \"nightly-6.3\"},\n  {\"\
        os_version\": \"focal\", \"swift_version\": \"6.3\"},\n  {\"os_version\": \"focal\", \"swift_version\": \"nightly-6.4.x\"\
        },\n  {\"os_version\": \"focal\", \"swift_version\": \"6.4.x\"},\n  {\"os_version\": \"focal\", \"swift_version\"\
        : \"nightly-main\"},\n]\n"
      enable_android_sdk_build: true
      enable_android_sdk_checks: true
      enable_freebsd_checks: true
  build-abi-stable:
    name: Build ABI Stable
    uses: rksharma-owg/swift-system/.github/workflows/fork-package.yml@main
    with:
      enable_linux_checks: false
      enable_macos_checks: true
      enable_windows_checks: false
      macos_build_command: xcrun swift build --build-tests
      macos_exclude_xcode_versions: '[]'
      swift_flags: -Xbuild-tools-swiftc -DSYSTEM_CI -Xbuild-tools-swiftc -DSYSTEM_ABI_STABLE
  cmake_build:
    name: CMake Validation
    runs-on: ubuntu-latest
    container: swiftlang/swift:nightly-main-noble
    steps:
    - name: Copy Sources
      uses: actions/checkout@v6
      with:
        ref: ${{ github.event.inputs.patch_sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Verify exact patch and baseline
      shell: bash
      env:
        PATCH_SHA: ${{ github.event.inputs.patch_sha }}
        BASE_SHA: ${{ github.event.inputs.base_sha }}
      run: 'set -euo pipefail

        git config --global --add safe.directory "$GITHUB_WORKSPACE"

        test "$(git rev-parse HEAD)" = "$PATCH_SHA"

        git merge-base --is-ancestor "$BASE_SHA" HEAD

        git log -1 --format=fuller

        printf ''Baseline: %s\n'' "$BASE_SHA"'
    - name: Install Dependencies
      shell: bash
      run: apt update && apt install -y cmake ninja-build jq
    - name: Configure Project
      shell: bash
      run: 'mkdir -p build/.cmake/api/v1/query

        touch build/.cmake/api/v1/query/codemodel-v2

        cmake -G ''Ninja'' -B build -S . -DCMAKE_C_COMPILER=clang -DCMAKE_Swift_COMPILER=swiftc -DCMAKE_BUILD_TYPE=Release
        -DBUILD_SHARED_LIBS=YES

        '
    - name: Validate CMake File Lists
      shell: bash
      run: "swift package describe --type json > /tmp/swiftpm.json\ncat build/.cmake/api/v1/reply/target-SystemPackage-*.json\
        \ > /tmp/cmake.json\njq '.targets[] | select(.name == \"SystemPackage\") | .sources[]' /tmp/swiftpm.json | sort >\
        \ /tmp/swiftpm-list.txt\njq '.sources[].path[15:]' /tmp/cmake.json | sort > /tmp/cmake-list.txt\ncomm -23 /tmp/swiftpm-list.txt\
        \ /tmp/cmake-list.txt > /tmp/missing.txt\nif [ -s /tmp/missing.txt ]; then\n  echo \"::error::SystemPackage CMakeLists.txt\
        \ does not match SwiftPM. Missing sources:\"\n  cat /tmp/missing.txt\n  exit 1\nfi\necho \"::notice::SystemPackage\
        \ CMakeLists.txt matches SwiftPM\"\n"
    - name: Build Project with CMake
      shell: bash
      run: cmake --build build
  soundness:
    name: Soundness
    uses: rksharma-owg/swift-system/.github/workflows/fork-soundness.yml@main
    with:
      license_header_check_project_name: Swift.org
      docs_check_enabled: false
      unacceptable_language_check_enabled: false
      license_header_check_enabled: false
      format_check_enabled: false
      python_lint_check_enabled: false
      api_breakage_check_baseline: ${{ inputs.base_sha }}
  ioring-execution:
    name: Immutable buffer kernel write/read-back
    runs-on: ubuntu-latest
    steps:
    - name: Copy Sources
      uses: actions/checkout@v6
      with:
        ref: ${{ github.event.inputs.patch_sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Verify exact patch and baseline
      shell: bash
      env:
        PATCH_SHA: ${{ github.event.inputs.patch_sha }}
        BASE_SHA: ${{ github.event.inputs.base_sha }}
      run: 'set -euo pipefail

        git config --global --add safe.directory "$GITHUB_WORKSPACE"

        test "$(git rev-parse HEAD)" = "$PATCH_SHA"

        git merge-base --is-ancestor "$BASE_SHA" HEAD

        git log -1 --format=fuller

        printf ''Baseline: %s\n'' "$BASE_SHA"'
    - name: Run actual io_uring regression without container syscall filtering
      shell: bash
      run: 'set -euo pipefail

        docker run --rm --security-opt seccomp=unconfined -v "$GITHUB_WORKSPACE:/src" -w /src swift:6.4-noble bash -c ''swift
        test -Xbuild-tools-swiftc -DSYSTEM_CI --filter IORingTests.testWriteImmutableUnregisteredBuffer'' | tee /tmp/io-regression.log

        python3 - <<''VERIFY''

        from pathlib import Path

        s=Path(''/tmp/io-regression.log'').read_text()

        assert "Test Case ''IORingTests.testWriteImmutableUnregisteredBuffer'' passed" in s, ''Regression did not execute
        successfully (including possible kernel skip)''

        VERIFY'
'on':
  workflow_dispatch:
    inputs:
      patch_sha:
        type: string
        required: true
      base_sha:
        type: string
        required: true
